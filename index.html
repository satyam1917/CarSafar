<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CarSafar: Everything Cars. One Complete Journey. (concept prototype)</title>
<link rel="icon" type="image/png" href="img/carsafar-icon.png">
<link rel="apple-touch-icon" href="img/carsafar-icon.png">
<meta name="description" content="CarSafar: Everything Cars. One Complete Journey. Discover, compare, connect with verified dealers and buy your next car. Concept prototype.">
<meta name="theme-color" content="#1B2A5E">
<meta property="og:title" content="CarSafar: Everything Cars. One Complete Journey.">
<meta property="og:description" content="Decision Score, private dealer chat, test-drive booking and Resale Lock-In in one app. Concept prototype.">
<meta property="og:image" content="img/carsafar-logo.png">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e1530;--ink2:#26304d;--mut:#66708a;--line:#e7e8ef;--bg:#f6f6f9;--card:#fff;--pri:#d9161d;--pri-d:#b31016;--pri2:#fdeced;--mint:#0fb89a;--mint2:#e3f8f3;--amber:#f2a516;--amber2:#fff5df;--red:#c81e3a;--red2:#fde8ec;--blue2:#e8f0ff;--blue:#2f6fed;--r:16px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.disc{background:var(--ink);color:#c4c8d8;font-size:11.5px;text-align:center;padding:6px 12px}
.disc b{color:#fff}
/* header */
.hdr{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hin{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.6px}
.lg-icon{width:36px;height:36px}.lg-word{height:54px;width:auto}

.nav{display:flex;gap:4px}
.nav button{white-space:nowrap;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2)}
.nav button:hover,.nav button.on{background:var(--pri2);color:var(--pri)}
.hr{margin-left:auto;display:flex;align-items:center;gap:10px}
.citysel{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:13.5px;font-weight:600;background:#fff}
.citysel select{border:0;background:none;font-weight:700;outline:none}
.bell{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--line);background:#fff}
.dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.view{display:flex;background:var(--bg);border-radius:12px;padding:3px;border:1px solid var(--line)}
.view button{padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--mut)}
.view button.on{background:var(--ink);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* hero */
.hero{background:radial-gradient(1200px 400px at 85% -20%,#ffd9d4 0%,transparent 60%),linear-gradient(180deg,#fff,var(--bg));border-bottom:1px solid var(--line)}
.hgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:44px 0 40px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--pri2);color:var(--pri);font-weight:700;font-size:12.5px;padding:6px 12px;border-radius:999px}
.hero h1{font-size:44px;line-height:1.08;letter-spacing:-1.4px;margin:16px 0 12px}
.hero h1 em{font-style:normal;color:var(--pri)}
.hero p.sub{font-size:16.5px;color:var(--mut);line-height:1.55;margin:0 0 22px;max-width:540px}
.askbar{display:flex;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(150,20,30,.08);max-width:560px}
.askbar:focus-within{border-color:var(--pri)}
.askbar input{flex:1;border:0;outline:none;padding:10px 10px;font-size:15px;background:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;font-size:14.5px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--pri);color:var(--pri)}
.btn.mint{background:var(--mint)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--ink2);font-weight:600}
.trust span{display:flex;align-items:center;gap:6px}
.tick{width:18px;height:18px;border-radius:50%;background:var(--mint2);color:var(--mint);display:grid;place-items:center;font-size:11px;font-weight:800}
.finder{background:#fff;border-radius:22px;padding:22px;box-shadow:0 20px 50px rgba(30,40,80,.12);border:1px solid var(--line)}
.finder h3{margin:0 0 4px;font-size:18px}
.finder .s{font-size:13px;color:var(--mut);margin-bottom:14px}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;padding:8px;border-radius:9px;font-size:13px;font-weight:700;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.ch{padding:9px 13px;border-radius:11px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600;background:#fff}
.ch:hover{border-color:var(--pri)}
.ch.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
/* sections */
.sec{padding:34px 0 8px}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.sh h2{font-size:24px;letter-spacing:-.6px;margin:0}
.sh p{margin:4px 0 0;color:var(--mut);font-size:14px}
.link{color:var(--pri);font-weight:700;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;transition:.18s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(30,40,80,.10);border-color:#f1d2d2}
.art{background:linear-gradient(160deg,#f7f5f5,#efedf0);display:grid;place-items:center;height:150px;position:relative}
.art .tag{position:absolute;top:10px;left:10px;font-size:11px;font-weight:700;background:#fff;border-radius:8px;padding:4px 8px;color:var(--ink2)}
.cb{padding:14px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cb .brand{font-size:12px;color:var(--mut);font-weight:600}
.cb h4{margin:0;font-size:16.5px}
.cb .price{font-weight:800;font-size:15.5px;margin-top:2px}
.cb .price small{font-weight:500;color:var(--mut);font-size:11.5px}
.cb .meta{font-size:12.5px;color:var(--mut)}
.sw{display:flex;gap:4px;margin-top:6px}
.sw i{width:13px;height:13px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}
.cact{display:flex;gap:8px;margin-top:10px}
.cact .btn{flex:1;padding:9px}
.tabrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.brands{display:grid;grid-template-columns:repeat(7,1fr);gap:12px}
.brand-t{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 8px;text-align:center;font-weight:700;font-size:14px}
.brand-t:hover{border-color:var(--pri);color:var(--pri)}
.mono{width:44px;height:44px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;margin:0 auto 8px;font-weight:800}
.offers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.offer{background:linear-gradient(135deg,var(--ink),#1d2a55);color:#fff;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.offer .amt{font-size:22px;font-weight:800;color:#ffc2bd}
.offer .d{font-size:12.5px;color:#c4c8d8}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.step .n{width:32px;height:32px;border-radius:10px;background:var(--pri2);color:var(--pri);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.step h4{margin:0 0 6px;font-size:16px}
.step p{margin:0;font-size:13.5px;color:var(--mut);line-height:1.5}
footer{margin-top:50px;background:var(--ink);color:#c4c8d8;font-size:13px}
footer .wrap{padding:30px 20px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer b{color:#fff}
/* listing */
.lgrid{display:grid;grid-template-columns:250px 1fr;gap:22px;padding:24px 0}
.filters{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;align-self:start;position:sticky;top:82px}
.filters h4{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.filters h4:first-child{margin-top:0}
.filters .ch{padding:7px 10px;font-size:12.5px}
.lhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.lhead h2{margin:0;font-size:22px;letter-spacing:-.5px}
.sel{border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;font-size:13.5px;background:#fff;font-weight:600}
.lgrid .grid{grid-template-columns:repeat(3,1fr)}
.empty{padding:40px;text-align:center;color:var(--mut);background:#fff;border-radius:16px;border:1px dashed var(--line)}
/* model page */
.crumb{font-size:13px;color:var(--mut);padding:18px 0 6px}
.crumb button{color:var(--pri);font-weight:600}
.mtop{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:start}
.gal{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.stage{border-radius:16px;height:330px;display:grid;place-items:center;position:relative;overflow:hidden;transition:background .3s}
.stage .cname{position:absolute;left:16px;bottom:14px;background:rgba(255,255,255,.9);padding:6px 10px;border-radius:9px;font-size:13px;font-weight:700}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.swb{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);transition:.15s}
.swb.on{box-shadow:0 0 0 2.5px var(--pri)}
.info{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px;position:sticky;top:82px}
.info .brand{color:var(--mut);font-weight:600;font-size:13.5px}
.info h1{margin:2px 0 6px;font-size:30px;letter-spacing:-.8px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.p-mint{background:var(--mint2);color:#0a8a73}.p-pri{background:var(--pri2);color:var(--pri)}.p-amb{background:var(--amber2);color:#9a6400}.p-red{background:var(--red2);color:var(--red)}.p-gr{background:var(--bg);color:var(--mut)}.p-blue{background:var(--blue2);color:var(--blue)}
.big{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:10px}
.big small{font-size:13px;color:var(--mut);font-weight:500;letter-spacing:0}
.onroad{background:var(--bg);border-radius:12px;padding:12px;margin:12px 0;font-size:13.5px}
.onroad .row{display:flex;justify-content:space-between;padding:3px 0}
.ctas{display:grid;gap:8px;margin-top:12px}
.alert{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13.5px;padding:12px;border-radius:12px;border:1px solid var(--line);margin-top:10px}
.tg{width:44px;height:26px;border-radius:13px;background:#cfcde0;position:relative;flex:none;transition:.2s}
.tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--mint)}
.tg.on:after{left:21px}

.blk{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;scroll-margin-top:125px}
.blk h3{margin:0 0 14px;font-size:18px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.spec{background:var(--bg);border-radius:12px;padding:12px}
.spec b{display:block;font-size:14.5px}
.spec span{font-size:12px;color:var(--mut)}
table.vt{width:100%;border-collapse:collapse;font-size:14px}
.vt th{text-align:left;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.vt td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.vt td small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.emi{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.rng label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;margin:10px 0 6px}
.rng input[type=range]{width:100%;accent-color:var(--pri)}
.emibox{background:linear-gradient(135deg,var(--pri),#ef4a3a);color:#fff;border-radius:16px;padding:20px;text-align:center}
.emibox .v{font-size:34px;font-weight:800;letter-spacing:-1px}
.emibox .d{font-size:12.5px;opacity:.85;line-height:1.5}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(14,21,48,.08)}
.sticky .in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px}
.sticky .t{flex:1;min-width:0;font-size:14px;line-height:1.35}.sticky .t b{display:block;font-size:15px}.sticky .t span{color:var(--mut);font-size:12.5px}
.sticky .btn{padding:12px 18px}
body.has-sticky{padding-bottom:78px}
/* chat drawer */
.scrim{position:fixed;inset:0;background:rgba(14,21,48,.35);z-index:60;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#fff;z-index:61;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(14,21,48,.2);animation:slide .25s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.dh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dh .t{flex:1;min-width:0}
.dh .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .t span{font-size:12px;color:var(--mut)}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.x:hover{background:var(--bg)}
.modeb{display:flex;align-items:center;gap:8px;padding:9px 16px;background:var(--blue2);font-size:12.5px;color:#1f4fbf}
.modeb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modeb button{margin-left:auto;font-weight:800;color:var(--blue);white-space:nowrap}
.log{flex:1;overflow:auto;padding:16px;background:#faf9fe;display:flex;flex-direction:column;gap:9px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.48;white-space:pre-line}
.msg.u{align-self:flex-end;background:var(--pri);color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.d{align-self:flex-start;background:var(--blue2);border-bottom-left-radius:5px}
.msg.sys{align-self:center;background:none;color:var(--mut);font-size:12px;text-align:center;max-width:96%;padding:2px}
.who{font-size:11px;font-weight:800;color:var(--mut);margin-bottom:3px;letter-spacing:.2px}
.msg.d .who{color:var(--blue)}
.fb{display:flex;gap:5px;margin-top:7px}
.fb button{font-size:12px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);color:var(--mut)}
.fb button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ccard{align-self:stretch;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;font-size:13.5px}
.ccard h5{margin:0 0 6px;font-size:14.5px}
.f{display:grid;gap:4px;font-size:12px;color:var(--mut);font-weight:600;flex:1;min-width:120px}
.f select{border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:13.5px;background:#fff;color:var(--ink)}
.frow{display:flex;gap:8px;flex-wrap:wrap}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.slot{padding:7px 10px;border:1.5px solid var(--line);border-radius:10px;font-size:12.5px;background:#fff;font-weight:600}
.slot.on{border-color:var(--pri);background:var(--pri2);color:var(--pri)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0;border-top:1px solid var(--line);scrollbar-width:none}
.chip{flex:none;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;background:#fff}
.chip:hover{border-color:var(--pri);color:var(--pri)}
.inp{display:flex;gap:8px;padding:10px 14px 14px}
.inp input{flex:1;border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14px;outline:none}
.inp input:focus{border-color:var(--pri)}
.send{width:46px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:17px}
.extra{display:flex;gap:6px;padding:8px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.typing{align-self:flex-start;color:var(--mut);font-size:12.5px;padding:2px 6px}
.ctx{background:var(--bg);border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.6;margin:8px 0}
.note{padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.note small{display:block;color:var(--mut);font-size:11.5px;margin-top:3px}
/* dealer + metrics */
.dgrid{display:grid;grid-template-columns:360px 1fr;gap:16px;padding:24px 0}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph h3{margin:0;font-size:15px;flex:1}
.lead{display:block;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}
.lead:hover,.lead.on{background:#faf9fe}
.lead.on{box-shadow:inset 3px 0 0 var(--pri)}
.lead .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:14px}
.lead .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.thread{display:flex;flex-direction:column;height:680px}
.qr{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;border-top:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi .l{font-size:12px;color:var(--mut);font-weight:700}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-top:4px}
.kpi .c{font-size:12px;margin-top:3px;font-weight:600}
.kpi.ns{background:linear-gradient(135deg,var(--ink),#1d2a55);color:#fff;border:0}
.kpi.ns .l{color:#c4c8d8}
.mgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}
.box h3{margin:0 0 4px;font-size:16px}
.box .sub{font-size:12.5px;color:var(--mut);margin-bottom:12px}
.fun{display:grid;gap:8px}
.fr{display:grid;grid-template-columns:160px 1fr 60px;gap:10px;align-items:center;font-size:13px}
.fbar{height:28px;background:var(--bg);border-radius:8px;overflow:hidden}
.fbar>div{height:100%;background:linear-gradient(90deg,var(--pri),#ff6b5b);border-radius:8px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:12px;font-weight:800;min-width:max-content}
.conv{font-size:12px;color:var(--mut);text-align:right;font-weight:700}
.gr{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}

function inr(n) {

function onRoad(exShowroom, city) {

function findCars(q) {

      const re = new RegExp("(^|[^a-z0-9])" + a.replace(/[-]/g, "\\-") + "([^a-z0-9]|$)");

function parseDown(q) {

// ===== Answer engine: grounded only in the catalogue above =====
function answer(query, ctx) {
  const q = query.toLowerCase();
  const city = findCity(q) || ctx.city;
  const cars = findCars(q);
  const car = cars[0] || ctx.car || null;
  const other = mentionsOtherCar(q);
  const otherNote = (other && cars.length) ? `\n(I don't have verified data for the other model you mentioned, so I've left it out rather than guess.)` : "";

  // 1. Privacy: never share a dealer's personal contact
  if (/(dealer|salesman|agent|showroom).*(number|phone|mobile|contact|whatsapp)|(number|phone|mobile|contact).*(dealer|salesman)/.test(q))
    return { kind: "refuse", text: "I can't share a dealer's personal number. You can chat with a verified dealer right here, and your own number stays hidden too until you choose to share it." };

  // 2. City outside the pilot: never fall back to another city's price
  const badCity = unsupportedCity(q);
  if (badCity && !findCity(q) && /price|on[\s-]?road|cost|kitna|kitne|daam|emi|loan/.test(q))
    return { kind: "not_covered", text: `On-road prices differ by city (RTO and insurance), and ${badCity[0].toUpperCase() + badCity.slice(1)} isn't in this pilot yet, so I won't show you another city's price. Supported cities: ${Object.keys(CITIES).join(", ")}. A verified dealer can quote for your city.` };

  // 3. Cars outside the catalogue: never guess
  if (other && cars.length === 0)
    return { kind: "not_covered", text: `I don't have verified data for that model yet, so I won't guess. I can help with ${CARS.length} popular cars, including ${CARS.slice(0, 6).map(c => c.model).join(", ")} and more.` };

  // 4. Test drive
  if (/test[\s-]?drive/.test(q))
    return { kind: "testdrive", text: `Sure, let's book a test drive for the ${car ? car.name : "car"} in ${city}. Pick a slot below and the dealer confirms it here.` };

  // 5. Colours: what's offered is catalogue data; availability and delivery are dealer-only
  const stockQ = /availab|stock|deliver|waiting|quick|jaldi|kab milegi|ready/.test(q);
  if (car && COLOR_WORDS.test(q)) {
    const col = matchColor(car, q);
    if (stockQ) return { kind: "handoff", color: col ? col.n : null, text: `${col ? `Yes, the ${car.name} is offered in ${col.n}. ` : ""}Which colours are in stock, and how fast they can deliver, changes daily by dealer. A verified dealer in ${city} can confirm it, and your number stays hidden.` };
    return { kind: "answer", text: `${car.name} comes in ${car.colors.length} colours: ${car.colors.map(c => c.n).join(", ")}.${col ? `\n${col.n} is one of them. Want me to check stock and delivery with a dealer?` : ""}` };
  }

  // 6. Dealer-only information: offers, discounts, stock, delivery, waiting period
  if (/offer|discount|deal|cashback|exchange bonus|best price|negotiat|stock|availab|deliver|waiting|booking amount|kab milegi|chhoot|chhut/.test(q))
    return { kind: "handoff", text: `Offers, stock and delivery change daily and differ by dealer, so I can't confirm them. A verified dealer in ${city} can tell you exactly, and your number stays hidden.` };

  // 7. EMI
  if (/emi|loan|finance|installment|instalment|monthly/.test(q)) {
    if (!car) return { kind: "answer", text: "Which car should I calculate the EMI for?" };
    const v = car.variants[0];
    const total = onRoad(v.p, city).total;
    const down = parseDown(q) ?? Math.round(total * 0.2);
    const months = parseTenure(q) ?? 60;
    const principal = Math.max(total - down, 0);
    if (principal === 0) return { kind: "answer", text: `A down payment of ${inr(down)} covers the full on-road price of ${inr(total)} for the ${car.name} ${v.n} in ${city}, so you wouldn't need a loan.` };
    const e = emi(principal, months);
    return { kind: "answer", text: `Indicative EMI for ${car.name} ${v.n} in ${city}: about ${inr(e)}/month.\nOn-road ${inr(total)} − down payment ${inr(down)} = loan ${inr(principal)}, ${months} months at ${INTEREST}% p.a.\nIndicative only: the final rate depends on the lender and your credit profile.` };

    if (car) return { kind: "answer", text: car.seats === want ? `Yes, the ${car.name} seats ${want}.` : `No, the ${car.name} seats ${car.seats}, not ${want}.` + (fits.length ? ` ${want}-seaters here: ${fits.join(", ")}.` : "") };
    return { kind: "answer", text: fits.length ? `${want}-seaters here: ${fits.join(", ")}.` : `None of the cars here are ${want}-seaters.` };
  }

  // 9. Mileage / comparison
  const wantsPrice = /price|on[\s-]?road|cost|kitna|kitne|daam|kimat|keemat/.test(q);
  if (!wantsPrice && /mileage|kmpl|average|fuel efficien|compare|vs\.?|versus/.test(q)) {
    if (cars.length >= 2) {

      const better = a.mileage >= b.mileage ? a : b;
      return { kind: "answer", text: `Claimed mileage (ARAI): ${a.name} ${a.mileage} kmpl vs ${b.name} ${b.mileage} kmpl. ${better.name} is more fuel-efficient on paper.\nBoot space: ${a.name} ${a.boot} L vs ${b.name} ${b.boot} L.` };

    if (car) return { kind: "answer", text: `${car.name} claimed mileage (ARAI): ${car.mileage} kmpl. Real-world figures are usually 15–20% lower in city traffic.` + otherNote };

  }

    return { kind: "answer", text: `${car.name} variants (ex-showroom):\n` + car.variants.map(v => `• ${v.n}: ${inr(v.p)}. ${v.f}`).join("\n") };

  // 12. Price

    if (!car) return { kind: "answer", text: `Which car? I can give on-road prices for ${CARS.length} cars, e.g. ${CARS.slice(0, 5).map(c => c.model).join(", ")}.` };
    const lead = cars.length >= 2 ? cars.slice(1).map(c2 => `${c2.name} starts at ${inr(onRoad(c2.variants[0].p, city).total)} on-road in ${city}.\n`).join("") : "";

    const base = rows[0].r;
    return { kind: "answer", text: lead + `${car.name} on-road price in ${city}: ${inr(rows[0].r.total)} (${rows[0].v.n}) to ${inr(rows[rows.length - 1].r.total)} (${rows[rows.length - 1].v.n}).\nBase variant breakup: ex-showroom ${inr(base.ex)} + RTO ${inr(base.rto)} + insurance ${inr(base.ins)} + other ${inr(base.other)}.` + otherNote };

  // 12b. Resale value

  // 13. Safety

  // 14. Budget search
  const bud = q.match(/under\s*(?:₹|rs\.?)?\s*(\d+(?:\.\d+)?)\s*(l|lakh|lac)/);
  if (bud) {
    const cap = parseFloat(bud[1]) * 100000;

    return { kind: "answer", text: fits.length ? `Cars starting under ${lakh(cap)} (ex-showroom): ${fits.map(c => `${c.name} (${lakh(c.variants[0].p)})`).join(", ")}.` : `None of the cars here start under ${lakh(cap)}.` };

  // 15. Off-topic or unclear
  if (car) return { kind: "answer", text: `I can help with the ${car.name}: on-road price, EMI, variants, colours, mileage or safety. For offers, stock or delivery I'll connect you to a verified dealer.` };
  return { kind: "redirect", text: "I can only help with buying a car: prices, EMI, variants, colours, mileage, safety and dealer offers. Which car are you looking at?" };
}


// ===== Decision Score (personalised, transparent weighted scoring) =====
// Brand-level indices are stated assumptions for the prototype (would come from service-cost and resale data in production).
const BRAND_MAINT = { Maruti: 95, Toyota: 90, Hyundai: 85, Honda: 85, Kia: 80, Tata: 75, Mahindra: 70 };
const BRAND_RESALE = { Maruti: 92, Toyota: 92, Hyundai: 85, Honda: 82, Mahindra: 80, Kia: 78, Tata: 72 };
const ATTR_LABEL = { boot: "boot space", safety: "safety", maint: "low maintenance", resale: "resale value", tech: "tech features", legroom: "rear legroom" };
function attrScores(c) {
  const boots = CARS.map(x => x.boot), bmin = Math.min(...boots), bmax = Math.max(...boots);
  const top = c.variants[c.variants.length - 1].f.toLowerCase();
  const techHits = ["adas", "360", "sunroof", "ventilated", "hud", "10.25", "9\"", "bose", "jbl", "harman", "sony", "wireless"].filter(k => top.includes(k)).length;
  const safety = c.ncap ? ({ 5: 100, 4: 80, 3: 60 }[parseInt(c.ncap)] || 50) : (c.airbags >= 6 ? 55 : 35);
  const wbs = CARS.map(x => x.wb), wmin = Math.min(...wbs), wmax = Math.max(...wbs);
  return { legroom: Math.round(40 + 60 * (c.wb - wmin) / (wmax - wmin)), boot: Math.round(40 + 60 * (c.boot - bmin) / (bmax - bmin)), safety, maint: BRAND_MAINT[c.brand], resale: BRAND_RESALE[c.brand], tech: Math.min(100, 40 + techHits * 15) };
}
// prefs: { family: 4|5|7, use: 'city'|'highway'|'mixed', budget: rupees (max on-road), flex: 0|0.1|0.2, fuel: 'Any'|'Petrol'|'Diesel'|'CNG'|'Hybrid', ranks: ['safety','resale','boot','maint','tech'] }
function decisionScore(c, prefs, city) {
  const w = {}; prefs.ranks.forEach((k, i) => w[k] = Math.max(1, 6 - i));
  const wsum = Object.values(w).reduce((a, b) => a + b, 0);
  const a = attrScores(c);
  const fit = prefs.ranks.reduce((s, k) => s + a[k] * w[k], 0) / wsum;
  const urban = { hatch: 100, tallhatch: 100, micro: 95, sedan: 80, csuv: 85, suv: 65, muv: 60, bigsuv: 45 }[c.body];
  const hwy = { hatch: 55, tallhatch: 45, micro: 60, sedan: 80, csuv: 75, suv: 95, muv: 85, bigsuv: 100 }[c.body] + (c.fuel.includes("Diesel") ? 5 : 0);
  const mil = Math.min(100, 40 + (c.mileage - 15) * 6);
  const gcs = Math.min(100, Math.max(20, 20 + (c.gc - 160) * 1.6));      // 160 mm -> 20, 210 mm -> 100
  const use = prefs.use === "city" ? 0.5 * urban + 0.5 * mil : prefs.use === "highway" ? 0.7 * Math.min(100, hwy) + 0.3 * mil :
    prefs.use === "rough" ? 0.5 * gcs + 0.3 * Math.min(100, urban + 10) + 0.2 * mil : 0.5 * Math.min(100, hwy) + 0.5 * mil;
  const base = onRoad(c.variants[0].p, city).total, cap = prefs.budget * (1 + prefs.flex);
  const budget = base <= prefs.budget ? 100 : base <= cap ? 75 : Math.max(10, 75 - (base - cap) / prefs.budget * 200);
  let score = 0.6 * fit + 0.25 * use + 0.15 * budget;
  score = score >= 75 ? 75 + (score - 75) * 1.3 : 75 + (score - 75) * 2;   // spread scores; softer at the top so no car looks 'perfect'
  const notes = [];
  if (prefs.family >= 6 && c.seats < 7) { score *= 0.55; notes.push(`it seats only ${c.seats}, and your family needs 7`); }
  if (prefs.fuel !== "Any" && !c.fuel.includes(prefs.fuel)) { score *= 0.8; notes.push(`no ${prefs.fuel} option`); }
  if (base > cap) notes.push(`its starting on-road price (${inr(base)}) is above your budget`);
  if (!c.ncap && prefs.ranks.indexOf("safety") <= 1) notes.push("no verified crash-test rating in our data");
  score = Math.max(0, Math.min(100, Math.round(score)));
  const ranked = prefs.ranks.slice(0, 3).map(k => ({ k, v: a[k] }));
  const best = ranked.slice().sort((x, y) => y.v - x.v)[0], worst = ranked.slice().sort((x, y) => x.v - y.v)[0];
  let why = `Scores high on ${ATTR_LABEL[best.k]}`;
  if (worst.k !== best.k && worst.v < 75) why += ` but lower on ${ATTR_LABEL[worst.k]}`;
  why += prefs.use === "rough" ? `; ${c.gc >= 185 ? "good" : "low"} ground clearance (~${c.gc} mm) for bumpy, crowded roads.` : prefs.use === "city" ? `; ${use >= 75 ? "easy" : "less easy"} for city driving.` : prefs.use === "highway" ? `; ${use >= 75 ? "comfortable" : "less suited"} for highway runs.` : ".";
  if (notes.length) why += ` Watch out: ${notes.join("; ")}.`;
  return { score, why, parts: { fit: Math.round(fit), use: Math.round(use), budget: Math.round(budget) }, attrs: a };
}

// ===== Resale Lock-In (indicative depreciation model) =====
function resaleEstimate(c, years, kmPerYear = 12000, city = "Delhi") {
  const price = onRoad(c.variants[0].p, city).ex;
  const d = 0.13 - (BRAND_RESALE[c.brand] - 80) / 300;      // yearly depreciation after year 1
  const kmAdj = Math.max(0.85, 1 - Math.max(0, kmPerYear - 12000) / 100000);
  const value = price * 0.85 * Math.pow(1 - d, Math.max(0, years - 1)) * kmAdj;
  const lock = value * 0.9;                                  // guaranteed buy-back = 90% of estimate (partner assumption)
  return { value: Math.round(value / 1000) * 1000, lock: Math.round(lock / 1000) * 1000, retained: Math.round(value / price * 100) };
}

// ===== Guardrail: mask contact details so chats stay on-platform =====
function maskContact(t) {
  let flagged = false;
  let out = t.replace(/(\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}\b/g, () => { flagged = true; return "[number hidden by CarSafar]"; });
  out = out.replace(/\b(whats\s?app|wa\.me\/\S*)/gi, m => { flagged = true; return "[off-platform link removed]"; });
  return { text: out, flagged };
}

function leadTag(lead) {
  if (lead.timeline === "This month" && lead.budgetOk) return "Hot";
  if (lead.timeline === "This month" || lead.timeline === "1–3 months") return "Warm";
  return "Cold";
}

if (typeof module !== "undefined") module.exports = { CARS, CITIES, answer, onRoad, emi, inr, lakh, leadTag, dealerFor, decisionScore, resaleEstimate, maskContact, attrScores };
